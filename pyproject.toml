[project]
name = "meridian-document-extraction"
version = "0.1.0"
description = "Deterministic PDF extraction pipeline for elevator inspection certificates, with a human review queue for anything the extractor isn't sure of."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
extract-layout-a = "extraction.cli:main"
route-documents = "extraction.routing_report:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
