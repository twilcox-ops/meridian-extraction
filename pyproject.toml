[project]
name = "meridian-document-extraction"
version = "0.1.0"
description = "Deterministic PDF extraction pipeline for elevator inspection certificates, with a human review queue for anything the extractor isn't sure of."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.30"]

[project.scripts]
report-accuracy = "extraction.cli:main"
route-documents = "extraction.routing_report:main"
validate-documents = "extraction.validation_report:main"
build-review-queue = "extraction.review_queue:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
